    <script>
      (function() {
        var origErr = console.error;
        var origWarn = console.warn;
        function isSuppressed(args) {
          try {
            var msg = Array.prototype.slice.call(args).map(function(item) {
              if (!item) return '';
              if (typeof item === 'object') {
                return (item.message || '') + ' ' + (item.stack || '') + ' ' + JSON.stringify(item);
              }
              return String(item);
            }).join(' ').toLowerCase();

            return (
              msg.indexOf('websocket') !== -1 ||
              msg.indexOf('closed without opened') !== -1 ||
              msg.indexOf('vite-hmr') !== -1 ||
              msg.indexOf('@vite/client') !== -1 ||
              msg.indexOf('failed to connect') !== -1 ||
              msg.indexOf('telemetry') !== -1 ||
              msg.indexOf('database exhausted') !== -1 ||
              msg.indexOf('quota') !== -1
            );
          } catch (e) {
            return false;
          }
        }
        console.error = function() {
          if (isSuppressed(arguments)) return;
          origErr.apply(console, arguments);
        };
        console.warn = function() {
          if (isSuppressed(arguments)) return;
          origWarn.apply(console, arguments);
        };
        window.addEventListener('error', function(e) {
          var text = String((e && (e.message || (e.error && e.error.message))) || '').toLowerCase();
          if (text.indexOf('websocket') !== -1 || text.indexOf('closed without opened') !== -1) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var text = String((e && (e.reason && (e.reason.message || e.reason))) || '').toLowerCase();
          if (text.indexOf('websocket') !== -1 || text.indexOf('closed without opened') !== -1) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>

    <script>
      (function() {
        var start = Date.now();
        var dismissed = false;
        function hideSplash() {
          if (dismissed) return;
          dismissed = true;
          var el = document.getElementById('sera-app-splash');
          if (!el) return;
          el.classList.add('is-hiding');
          setTimeout(function() {
            if (el && el.parentNode) el.parentNode.removeChild(el);
          }, 380);
        }
        window.__dismissSeraSplash = function() {
          var elapsed = Date.now() - start;
          var wait = Math.max(0, 900 - elapsed);
          setTimeout(hideSplash, wait);
        };
        window.addEventListener('load', function() {
          window.__dismissSeraSplash();
        });
        setTimeout(hideSplash, 2400);
      })();
    </script>
