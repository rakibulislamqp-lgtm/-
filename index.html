    <script>
      (function() {
        var origErr = console.error;
        var origWarn = console.warn;
        function isSuppressed(args) {
          try {
            var msg = Array.prototype.slice.call(args).map(function(item) {
              if (!item) return '';
              if (typeof item === 'object') {
                return (item.message || '') + ' ' + (item.stack || '') + ' ' + JSON.stringify(item);
              }
              return String(item);
            }).join(' ').toLowerCase();

            return (
              msg.indexOf('websocket') !== -1 ||
              msg.indexOf('closed without opened') !== -1 ||
              msg.indexOf('vite-hmr') !== -1 ||
              msg.indexOf('@vite/client') !== -1 ||
              msg.indexOf('failed to connect') !== -1 ||
              msg.indexOf('telemetry') !== -1 ||
              msg.indexOf('database exhausted') !== -1 ||
              msg.indexOf('quota') !== -1
            );
          } catch (e) {
            return false;
          }
        }
        console.error = function() {
          if (isSuppressed(arguments)) return;
          origErr.apply(console, arguments);
        };
        console.warn = function() {
          if (isSuppressed(arguments)) return;
          origWarn.apply(console, arguments);
        };
        window.addEventListener('error', function(e) {
          var text = String((e && (e.message || (e.error && e.error.message))) || '').toLowerCase();
          if (text.indexOf('websocket') !== -1 || text.indexOf('closed without opened') !== -1) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var text = String((e && (e.reason && (e.reason.message || e.reason))) || '').toLowerCase();
          if (text.indexOf('websocket') !== -1 || text.indexOf('closed without opened') !== -1) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
